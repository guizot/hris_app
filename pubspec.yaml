name: hantera
description: "Hantera - SaaS Human Resource Application"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Remote Data Source
  #  dio: ^5.4.1
  #  http: ^1.2.2
  #  retrofit: ^4.1.0
  #  retrofit_generator: ^8.1.0
  #  json_annotation: ^4.8.1
  #  json_serializable: ^6.7.1
  intl: ^0.20.2

  # Build Generator
  build_runner: ^2.4.11

  # Shared Preferences
  shared_preferences: ^2.2.2

  # Hive Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1

  # Dependency Injection
  get_it: ^7.6.7

  # Path Provider
  path_provider: ^2.1.2
  provider: ^6.1.1

  # Bloc State Management
  flutter_bloc: ^8.1.4

  # For Testing Class
  equatable: ^2.0.5

  # UUID
  uuid: ^4.5.1

  # Flutter SVG
  flutter_svg: ^2.2.0

  # Flutter TTS
  flutter_tts: ^4.2.3

  # Image Picker
  image_picker: ^1.0.7

  # Image
  image: ^4.5.4

  flutter_staggered_grid_view: ^0.7.0
  palette_generator: ^0.3.3+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.otf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/poppins/Poppins-Medium.otf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.otf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.otf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.otf
          weight: 800
  assets:
    - assets/svg/packing.svg


    - assets/svg/trip.svg

    - assets/illustrations/Trip.svg

    - assets/illustrations/Packing.svg
    - assets/images/
    - assets/svg_feature/


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  