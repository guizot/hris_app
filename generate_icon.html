<!DOCTYPE html>
<html>
<head>
    <title>Generate Hantera Icon</title>
</head>
<body>
    <canvas id="canvas" width="1024" height="1024"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Create gradient background
        const gradient = ctx.createLinearGradient(0, 0, 1024, 1024);
        gradient.addColorStop(0, '#4F46E5');
        gradient.addColorStop(1, '#7C3AED');
        
        // Draw rounded rectangle background
        ctx.fillStyle = gradient;
        roundRect(ctx, 0, 0, 1024, 1024, 180);
        ctx.fill();
        
        // Draw people icons
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        
        // Central person (manager)
        ctx.beginPath();
        ctx.arc(512, 380, 60, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(452, 460);
        ctx.quadraticCurveTo(450, 480, 430, 540);
        ctx.lineTo(430, 640);
        ctx.lineTo(450, 660);
        ctx.lineTo(574, 660);
        ctx.lineTo(594, 640);
        ctx.lineTo(594, 540);
        ctx.quadraticCurveTo(574, 480, 572, 460);
        ctx.quadraticCurveTo(512, 460, 452, 460);
        ctx.fill();
        
        // Left person
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.arc(350, 420, 45, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(305, 475);
        ctx.quadraticCurveTo(305, 490, 290, 535);
        ctx.lineTo(290, 610);
        ctx.lineTo(305, 625);
        ctx.lineTo(395, 625);
        ctx.lineTo(410, 610);
        ctx.lineTo(410, 535);
        ctx.quadraticCurveTo(395, 490, 395, 475);
        ctx.quadraticCurveTo(350, 475, 305, 475);
        ctx.fill();
        
        // Right person
        ctx.beginPath();
        ctx.arc(674, 420, 45, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(629, 475);
        ctx.quadraticCurveTo(629, 490, 614, 535);
        ctx.lineTo(614, 610);
        ctx.lineTo(629, 625);
        ctx.lineTo(719, 625);
        ctx.lineTo(734, 610);
        ctx.lineTo(734, 535);
        ctx.quadraticCurveTo(719, 490, 719, 475);
        ctx.quadraticCurveTo(674, 475, 629, 475);
        ctx.fill();
        
        // Bottom person
        ctx.beginPath();
        ctx.arc(512, 520, 45, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(467, 575);
        ctx.quadraticCurveTo(467, 590, 452, 635);
        ctx.lineTo(452, 710);
        ctx.lineTo(467, 725);
        ctx.lineTo(557, 725);
        ctx.lineTo(572, 710);
        ctx.lineTo(572, 635);
        ctx.quadraticCurveTo(557, 590, 557, 575);
        ctx.quadraticCurveTo(512, 575, 467, 575);
        ctx.fill();
        
        // HR Text
        ctx.globalAlpha = 1;
        ctx.font = 'bold 120px Arial';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.textAlign = 'center';
        ctx.fillText('HR', 512, 850);
        
        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }
        
        // Download the image
        function downloadIcon(size) {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = size;
            tempCanvas.height = size;
            tempCtx.drawImage(canvas, 0, 0, size, size);
            
            const link = document.createElement('a');
            link.download = `hantera_icon_${size}.png`;
            link.href = tempCanvas.toDataURL();
            link.click();
        }
        
        // Generate all sizes
        setTimeout(() => {
            downloadIcon(1024);
            setTimeout(() => downloadIcon(512), 100);
            setTimeout(() => downloadIcon(192), 200);
            setTimeout(() => downloadIcon(144), 300);
            setTimeout(() => downloadIcon(96), 400);
            setTimeout(() => downloadIcon(72), 500);
            setTimeout(() => downloadIcon(48), 600);
            setTimeout(() => downloadIcon(36), 700);
        }, 100);
    </script>
</body>
</html>
