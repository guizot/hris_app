<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with rounded corners -->
  <rect width="1024" height="1024" rx="180" fill="url(#bgGradient)"/>
  
  <!-- HR Icon - People/Team representation -->
  <!-- Central person (manager) -->
  <circle cx="512" cy="380" r="60" fill="url(#iconGradient)"/>
  <path d="M 512 460 Q 450 480 430 540 L 430 640 Q 430 660 450 660 L 574 660 Q 594 660 594 640 L 594 540 Q 574 480 512 460" fill="url(#iconGradient)"/>
  
  <!-- Left person (employee) -->
  <circle cx="350" cy="420" r="45" fill="url(#iconGradient)" opacity="0.85"/>
  <path d="M 350 475 Q 305 490 290 535 L 290 610 Q 290 625 305 625 L 395 625 Q 410 625 410 610 L 410 535 Q 395 490 350 475" fill="url(#iconGradient)" opacity="0.85"/>
  
  <!-- Right person (employee) -->
  <circle cx="674" cy="420" r="45" fill="url(#iconGradient)" opacity="0.85"/>
  <path d="M 674 475 Q 629 490 614 535 L 614 610 Q 614 625 629 625 L 719 625 Q 734 625 734 610 L 734 535 Q 719 490 674 475" fill="url(#iconGradient)" opacity="0.85"/>
  
  <!-- Bottom person (employee) -->
  <circle cx="512" cy="520" r="45" fill="url(#iconGradient)" opacity="0.85"/>
  <path d="M 512 575 Q 467 590 452 635 L 452 710 Q 452 725 467 725 L 557 725 Q 572 725 572 710 L 572 635 Q 557 590 512 575" fill="url(#iconGradient)" opacity="0.85"/>
  
  <!-- HR Text -->
  <text x="512" y="850" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="url(#iconGradient)">HR</text>
</svg>